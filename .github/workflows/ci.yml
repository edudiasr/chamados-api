name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chamados
          POSTGRES_PASSWORD: chamados
          POSTGRES_DB: chamados_teste
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U chamados"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Testes de unidade
        run: npm test
      - name: Testes e2e (Postgres e Redis de verdade)
        run: npm run test:e2e
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t chamados-api .
